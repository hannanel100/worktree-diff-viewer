name: Release

# Pushing a v* tag publishes that version to npm and creates a GitHub release.
# Publishing uses npm trusted publishing (OIDC), so no npm token is stored here;
# the package's settings on npmjs.com must list this repository and workflow.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release create
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs npm 11.5.1+, which Node 24 ships.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      # prepublishOnly builds and runs the tests.
      - run: npm publish
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
